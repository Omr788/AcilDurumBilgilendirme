<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acil Durum Bilgilendirme</title>
    <link rel="stylesheet" href="css/style.CSS">
</head>

<body>

    <header>
        <div class="baslikBolumu">
            <img src="images/kalp.jpg" alt="Kalp">

            <div class="sagTaraf">
                <h1>
                    Acil Durum Bilgileri
                </h1>

                <div class="aciklama">
                    <p>
                        Bu bilgiler,acil durumlarda sağlık personelleri için hazırlanmıştır.
                    </p>
                </div>
            </div>
        </div>
    </header>
    <main>

        <section>
            <div class="kanKarti">

                <div class="kanBaslik">
                    <img src="images/blood.png" alt="Kan damlası">
                    <h2>Kan Grubu</h2>
                </div>

                <div class="kanBilgi">

                    <img src="images/blood.png" alt="Kan damlası">

                    <div class="cizgi"></div>

                    <div class="kanYazi">
                        <h3>A Rh +</h3>
                        <p>KAN GRUBU</p>
                    </div>

                </div>

            </div>
        </section>


        <section>
            <div class="alerjiKarti">

                <div class="alerjiBaslik">
                    <span>&#9888;</span>
                    <h2>Alerjiler</h2>
                </div>

                <div class="alerjiBilgi">
                    <h3>Penisilin</h3>
                    <p>Bilinen Alerji</p>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
